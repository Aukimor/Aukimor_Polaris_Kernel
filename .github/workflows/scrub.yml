name: scrub-check

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/scrub.yml'
      - 'lib/lz4/**'
      - 'crypto/lz4.c'
      - 'include/linux/lz4.h'
      - 'lib/decompress_unlz4.c'
      - 'lib/lzo/**'
      - 'lib/zstd/**'

permissions:
  contents: read

jobs:
  scrub:
    name: "🧹 空文件 / merge 残留 / lz4 旧文件检查"
    runs-on: ubuntu-22.04
    steps:
      - name: "⭐ 取源码"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🧹 空文件 (size 0)"
        run: |
          echo "=== 空文件 (size 0) ==="
          find . -type f -size 0 -not -path './.git/*' | sort | head -80
          echo "=== 空文件计数 ==="
          find . -type f -size 0 -not -path './.git/*' | wc -l

      - name: "🧹 merge 残留 (.orig/.rej/.bak/*~)"
        run: |
          echo "=== merge 残留 ==="
          find . -type f \( -name '*.orig' -o -name '*.rej' -o -name '*.bak' -o -name '*~' -o -name '*.swp' \) -not -path './.git/*' | sort | head -50
          echo "=== merge 残留计数 ==="
          find . -type f \( -name '*.orig' -o -name '*.rej' -o -name '*.bak' -o -name '*~' -o -name '*.swp' \) -not -path './.git/*' | wc -l

      - name: "🧹 旧 lz4 API 残留检查（老符号在非 lib/lz4 内出现=残留）"
        run: |
          echo "=== 旧 API 符号残留（lz4_compress / lz4_decompress / lz4_compressbound / unknownoutputsize）==="
          rg -n 'lz4_compressbound|lz4_decompress_unknownoutputsize' --glob '!lib/lz4/**' --glob '!lib/decompress_unlz4.c' . || echo "无残留 ✓"
          echo "=== 新版 API 已用（LZ4_compress_default / LZ4_decompress_safe 出现处）==="
          rg -l 'LZ4_compress_default|LZ4_decompress_safe' lib/lz4/ crypto/ include/linux/lz4.h | sort

      - name: "🧹 lz4 树内文件清单（确认新 7+3 件套，无旧名）"
        run: |
          find lib/lz4 -type f | sort