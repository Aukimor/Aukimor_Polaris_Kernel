name: Build polaris (186 88-zstd 基线)

on:
  push:
    branches: [ main ]
    paths:
      - 'arch/**'
      - 'block/**'
      - 'drivers/**'
      - 'fs/**'
      - 'include/**'
      - 'init/**'
      - 'kernel/**'
      - 'lib/**'
      - 'mm/**'
      - 'net/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'Makefile'
      - 'Kconfig'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Build-Kernel:
    name: "🐎 Build polaris kernel (88-zstd)"
    runs-on: ubuntu-22.04
    env:
      WORKSPACE: ${{ github.workspace }}
      KERNEL_DEVICE: polaris
      DEFCONFIG_NAME: polaris_user_defconfig
      ANYKERNEL_NAME: AnyKernel3
    steps:
      - name: "⭐ 取本仓库源码"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "⭐ Install prerequisites"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev make git unzip cpio device-tree-compiler python3 xz-utils rsync wget zip zstd gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: "🏷 源码版本"
        run: |
          git log --oneline -3

      - name: "⏰ Setup AnyKernel3 (unknownbaka 官方模板)"
        run: git clone --depth=1 https://github.com/unknownbaka/AnyKernel3 $ANYKERNEL_NAME

      - name: "💫 Cache clang13 工具链（作者同款）"
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKSPACE }}/clang13
          key: clang13-tools-${{ runner.os }}

      - name: "💫 Get toolchain (diyishengqing/android-kernel-tools clang13)"
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth=1 -j$(nproc) --branch clang13 https://github.com/diyishengqing/android-kernel-tools $WORKSPACE/clang13
          echo "$WORKSPACE/clang13/clang/host/linux-x86/clang-r428724/bin" >> $GITHUB_PATH
          echo "$WORKSPACE/clang13/linaro-gcc-4.9/aarch64-linux-gnu/bin" >> $GITHUB_PATH
          echo "$WORKSPACE/clang13/linaro-gcc-4.9/arm-linux-gnueabi/bin" >> $GITHUB_PATH

      - name: "💫 补 PATH（cache 恢复时也要）"
        run: |
          echo "$WORKSPACE/clang13/clang/host/linux-x86/clang-r428724/bin" >> $GITHUB_PATH
          echo "$WORKSPACE/clang13/linaro-gcc-4.9/aarch64-linux-gnu/bin" >> $GITHUB_PATH
          echo "$WORKSPACE/clang13/linaro-gcc-4.9/arm-linux-gnueabi/bin" >> $GITHUB_PATH

      - name: "😎 Set build args（作者配方：LD 走 GNU ld，不设 LLD）"
        id: generate-args
        run: |
          CB=$WORKSPACE/clang13/clang/host/linux-x86/clang-r428724/bin
          LIN=$WORKSPACE/clang13/linaro-gcc-4.9/aarch64-linux-gnu/bin
          LIN32=$WORKSPACE/clang13/linaro-gcc-4.9/arm-linux-gnueabi/bin
          args="-j$(nproc --all)"
          args="$args O=$WORKSPACE/out"
          args="$args ARCH=arm64"
          args="$args CC=$CB/clang"
          args="$args AR=$CB/llvm-ar"
          args="$args NM=$CB/llvm-nm"
          args="$args STRIP=$CB/llvm-strip"
          args="$args OBJCOPY=$CB/llvm-objcopy"
          args="$args OBJDUMP=$CB/llvm-objdump"
          args="$args OBJSIZE=$CB/llvm-size"
          args="$args READELF=$CB/llvm-readelf"
          args="$args HOSTCC=$CB/clang"
          args="$args HOSTCXX=$CB/clang++"
          args="$args HOSTAR=$CB/llvm-ar"

          args="$args CROSS_COMPILE=$LIN/aarch64-linux-gnu-"
          args="$args CROSS_COMPILE_ARM32=$LIN32/arm-linux-gnueabi-"
          echo "args=$args" >> $GITHUB_OUTPUT

      - name: "👍 Make defconfig"
        working-directory: ${{ env.WORKSPACE }}
        run: make ${{ steps.generate-args.outputs.args }} $DEFCONFIG_NAME

      - name: "🎶 Build kernel"
        working-directory: ${{ env.WORKSPACE }}
        run: make ${{ steps.generate-args.outputs.args }}

      - name: "💛 Package AnyKernel3"
        working-directory: ${{ env.ANYKERNEL_NAME }}
        run: |
          rm -rf .git
          cp $WORKSPACE/packaging/anykernel-polaris.sh ./anykernel.sh
          cp $WORKSPACE/out/arch/arm64/boot/Image.gz-dtb ./Image.gz-dtb
          zip -r -9 $WORKSPACE/${{ env.KERNEL_DEVICE }}-186-${{ github.run_id }}.zip .

      - name: "💙 Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: polaris-186
          path: |
            ${{ env.WORKSPACE }}/*.zip
          if-no-files-found: error
          retention-days: 7
