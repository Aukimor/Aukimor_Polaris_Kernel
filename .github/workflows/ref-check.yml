name: ref-check

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ref-check.yml'

permissions:
  contents: read

jobs:
  refcheck:
    name: "🔍 11 个空文件引用检查"
    runs-on: ubuntu-22.04
    steps:
      - name: "⭐ 取源码"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🔍 逐个查引用"
        run: |
          EMPTY_FILES=(
            "arch/arm/mach-imx/Makefile.boot"
            "arch/arm/mach-pxa/include/mach/pxa25x-udc.h"
            "drivers/input/sensors/smi130/modules.order"
            "drivers/input/touchscreen/focaltech_touch/include/firmware/fw_sample.i"
            "include/scsi/fc/Kbuild"
            "include/video/Kbuild"
            "tools/build/tests/ex/empty/Build"
            "tools/perf/util/help-unknown-cmd.h"
            "tools/testing/selftests/powerpc/copyloops/asm/processor.h"
            "tools/testing/selftests/powerpc/primitives/asm/ppc-opcode.h"
            "tools/virtio/linux/hrtimer.h"
          )
          for f in "${EMPTY_FILES[@]}"; do
            base=$(basename "$f")
            echo "############################################"
            echo "### $f"
            echo "--- 按 basename 全树引用（排除自身）---"
            rg -l "$base" --glob "!$f" . 2>/dev/null | head -10 || echo "  (basename 无引用)"
            echo "--- 按完整路径字符串引用 ---"
            rg -l "$f" --glob "!$f" . 2>/dev/null | head -5 || echo "  (路径无引用)"
            echo ""
          done

      - name: "📌 附带：这些目录是否参与编译（Kconfig/Makefile 有无挂载）"
        run: |
          echo "=== arch/arm/mach-imx 是否在 arch/arm/Kconfig 挂载 ==="
          rg -n 'mach-imx' arch/arm/Kconfig arch/arm/Makefile 2>/dev/null | head -3 || echo "  未挂载"
          echo "=== arch/arm/mach-pxa 是否挂载 ==="
          rg -n 'mach-pxa' arch/arm/Kconfig arch/arm/Makefile 2>/dev/null | head -3 || echo "  未挂载"
          echo "=== smi130 目录 Makefile ==="
          cat drivers/input/sensors/smi130/Makefile 2>/dev/null | head -5
          echo "=== focaltech_touch 目录 makefile/fw 引用 ==="
          rg -n 'fw_sample' drivers/input/touchscreen/ 2>/dev/null | head -5 || echo "  fw_sample 无引用"
          echo "=== include/scsi/fc 与 include/video 有无 .h 文件 ==="
          ls include/scsi/fc/ include/video/ 2>/dev/null
          echo "=== 上层 include Kbuild 机制说明 ==="
          head -20 include/Kbuild 2>/dev/null